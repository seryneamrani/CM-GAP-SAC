# ==============================================================================
# CM-GAP-SAC — Evaluation Configuration (v3.0 — scenario-based)
# ==============================================================================
# Thesis: Safe multi-modal deep RL navigation for AgileX LIMO Pro
# Author: Seryne / Supervisor: Dr. Ali Djenadi (LITAN, ESTIN)
# Defense: 2026-09-05
# ------------------------------------------------------------------------------
# 7 scenarios × 4 methods × N episodes.
# Random spawn/goal anywhere in hospital, snapped to petite-room centers when
# they land in petite_1 or petite_2. Shield configured more restrictively than
# training (see shield_overrides).
# ==============================================================================

experiment:
  name: cm-gap-sac-thesis-eval-scenarios
  description: 7 scenarios varying pedestrian density × dynamicity + 1 static-only baseline
  version: 3.0.0
  created: "2026-07-14"
  author: seryne

global:
  master_seed: 42
  episodes_per_scenario: 100        # per (method, scenario) cell
  episodes_per_scenario_smoke: 5    # dev iteration
  episode_timeout_s: 60
  sim_step_s: 0.1
  run_root: runs/cm_gap_sac/checkpoint_final.pt 
  log_format: jsonl
  save_trajectories: true
  save_snapshots: true              # generate 1 PNG per scenario
  ros_distro: jazzy
  gz_version: harmonic

# ==============================================================================
# World
# ==============================================================================
worlds:
  hospital:
    sdf_path: ~/ros2_ws/src/worlds/hospital.sdf
    description: Training world; also eval world

# ==============================================================================
# Petite room centers — spawn/goal forced to these when they land inside a petite
# ==============================================================================
petite_centers:
  petite_1: [5.5, -5.5]     # center of ZONE_BOXES.petite_1
  petite_2: [5.5,  5.5]     # center of ZONE_BOXES.petite_2

# ==============================================================================
# Scenarios — the 7-row truth table
# ==============================================================================
scenarios:
  - id: S1_static_only
    n_pedestrians: 0
    pedestrian_speed_mps: 0.0
    description: Static obstacles only — pure static-avoidance baseline

  - id: S2_density3_low
    n_pedestrians: 3
    pedestrian_speed_mps: 0.3
    description: Low density (3 peds), low dynamicity (0.3 m/s)

  - id: S3_density3_high
    n_pedestrians: 3
    pedestrian_speed_mps: 0.5
    description: Low density (3 peds), high dynamicity (0.5 m/s)

  - id: S4_density5_low
    n_pedestrians: 5
    pedestrian_speed_mps: 0.3
    description: Medium density (5 peds), low dynamicity

  - id: S5_density5_high
    n_pedestrians: 5
    pedestrian_speed_mps: 0.5
    description: Medium density (5 peds), high dynamicity

  - id: S6_density7_low
    n_pedestrians: 7
    pedestrian_speed_mps: 0.3
    description: High density (7 peds), low dynamicity

  - id: S7_density7_high
    n_pedestrians: 7
    pedestrian_speed_mps: 0.5
    description: High density (7 peds), high dynamicity

# ==============================================================================
# Robot configuration (unchanged)
# ==============================================================================
robot:
  model: agilex_limo_pro
  urdf_path: ~/ros2_ws/src/limo_description/urdf/limo_pro.urdf
  spawn_yaw_mode: bearing_to_goal   # yaw = bearing + noise (matches train.py)
  spawn_yaw_noise_rad: 0.5235       # π/6
  goal_tolerance_m: 0.3
  sensors:
    lidar:  {topic: /scan, frame: laser_link, max_range: 12.0, num_beams: 360}
    camera: {topic: /camera/image_raw, frame: camera_link}
    imu:    {topic: /imu/data, frame: imu_link}
    odom:   {topic: /odom, frame: odom}

# ==============================================================================
# Methods — SINGLE METHOD for this eval phase
# Prof directive: "on teste l'algo tel quel". Ablation + baselines postponed.
# The other methods are kept commented for the post-defense ablation phase.
# ==============================================================================
methods:
  cm_gap_sac_full:
    type: rl_policy
    algorithm: sac
    components:
      cbf_shield: true
      cross_modal_attention: true
      social_lstm: true
      prioritized_replay: true
      nav2_global_planner: true
    training_required: true
    description: Full CM-GAP-SAC (thesis contribution — Nav2 + restrictive CBF)

