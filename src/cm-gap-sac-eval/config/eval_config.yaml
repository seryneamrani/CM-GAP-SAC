# ==============================================================================
# Checkpoints — 1.5M only
# ==============================================================================
checkpoints:
  cm_gap_sac_full:
    final_1_5M:
      path: /home/seryne/limo_jazzy_ws/runs/cm_gap_sac/checkpoint_final.pt
      description: End of training — hero checkpoint
      priority: critical
# ==============================================================================
# Shield overrides — more restrictive than training-time
# ------------------------------------------------------------------------------
# Applied when building the shield for eval. Prof directive: "shield doit être
# plus restrictif". Larger active radii = shield intervenes earlier = safer.
# Adjust values based on your CBF implementation's parameter names.
# ==============================================================================
shield_overrides:
  active_radius: 0.85              # 0.7 → 0.85 (au lieu de 1.5) — +20% seulement
  gamma_cbf: 1.8                   # 2.0 → 1.8 (au lieu de 1.0)
  r_safe_static: 0.28              # 0.25 → 0.28 (petit)
  omega_decay_min: 0.4             # 0.3 → 0.4 (au lieu de 0.7)
  omega_decay_penalty: 5.0         # 2.0 → 5.0 (au lieu de 20)
  omega_decay_soft_zone: 0.15
  emergency_stop_on_infeasible: true
  max_consecutive_infeasible: 8    # 10 → 8 (au lieu de 5)
  v_min_shield: 0.0                # PAS de reverse (matche training)
  n_free_dirs_static: 3            # 2 → 3 (comme training)
# ==============================================================================
# Metrics — same 24 as before (17 reference + 2 custom + 5 additional)
# ==============================================================================
metrics:
  navigation_core:
    success: true
    spl: true
    collision_pedestrian: true
    collision_static: true
    timeout: true
    freeze_at_start: true
    freeze_threshold_v: 0.05
    freeze_window_s: 4.0

  rl_diagnostics:
    episode_return: true
    episode_return_components: true
    reward_component_names: [goal, progress, collision, cbf_safety, social, smoothness]
    episode_length_steps: true
    policy_entropy_mean: true
    action_smoothness: true

  safety_cbf:
    intervention_rate: true
    correction_magnitude: true
    min_clearance_static: true
    min_clearance_pedestrian: true

  social:
    personal_space_violation_rate: true
    personal_space_threshold_m: 0.5
    social_discomfort_score: true
    social_discomfort_formulation: drl_vo

  efficiency:
    path_length_ratio: true
    time_to_goal: true

  robustness:
    perception_degradation_eval: false
    deepsort_track_loss_injection_rate: 0.1

# ==============================================================================
# Statistical framework — Wilson CI + McNemar (same as before)
# ==============================================================================
statistics:
  ci_method: wilson
  ci_level: 0.95
  bootstrap_n_resamples: 10000
  paired_tests:
    binary_metrics: mcnemar
    continuous_metrics: mann_whitney_u
  report_format:
    rates: "mean ± CI"
    continuous: "median + IQR"

# ==============================================================================
# Infrastructure — single station
# ==============================================================================
infrastructure:
  stations:
    station1:
      ros_domain_id: 42
      role: coordinator
      cuda_device: 0
  dds_config:
    fastdds_localhost_only: true
    disable_multicast: true
  parallelization:
    episodes_per_worker: 1
    gazebo_headless: true

# ==============================================================================
# Nav2 baseline configuration (unchanged)
# ==============================================================================
nav2_config:
  action_name: /navigate_to_pose
  cmd_vel_topic: /cmd_vel_nav
  action_server_timeout_s: 10
  goal_frame_id: map
