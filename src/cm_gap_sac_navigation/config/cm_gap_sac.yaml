# =====================================================================
# CM-GAP_SAC central configuration  (v0.2)
# All hyperparameters of the architecture, organized by module.
# Values traceable to:
#   - Zhang et al. 2025 (GAP_SAC backbone, hyperparameters Table 2)
#   - Haarnoja et al. 2018 (SAC defaults)
#   - Schaul et al. 2016 (PER defaults)
#   - Hall 1966 (proxemics, intimate zone 0.45 m)
#   - Lee et al 2020 (smoothness reward for sim-to-real)
#   - Ng et al. 1999 (potential-based reward shaping)
# =====================================================================

# ---------------------------------------------------------------------
# Robot platform: AgileX LIMO Pro (differential drive mode)
# ---------------------------------------------------------------------
robot:
  name: "limo"
  wheel_radius: 0.045
  wheel_separation: 0.172
  base_frame: "base_link"
  odom_frame: "odom"
  v_max:  0.5
  v_min: -0.3
  omega_max:  1.0
  omega_min: -1.0

# ---------------------------------------------------------------------
# Observation space
# ---------------------------------------------------------------------
observation:
  lidar:
    raw_n: 720
    n_beams: 360
    range_min: 0.05
    range_max: 6.0
    fov_deg: 360.0
  pedestrian:
    k_max: 5
    n_features: 5
    track_age_norm: 50
    relevance_radius: 4.0
  imu:                                  # NEW in v0.2
    n_features: 6                       # ax, ay, az, wx, wy, wz
    accel_max: 20.0                     # m/s^2 normalization bound
    gyro_max: 5.0                       # rad/s normalization bound
  goal:
    n_features: 4

# ---------------------------------------------------------------------
# Action space
# ---------------------------------------------------------------------
action:
  dim: 2

# ---------------------------------------------------------------------
# Episode settings
# ---------------------------------------------------------------------
episode:
  control_hz: 30.0
  max_steps: 600
  goal_radius: 0.50
  collision_radius_static: 0.20   # mur/meuble via LiDAR (capteur → surface)
  collision_radius_ped:    0.46   # piéton via distance GT (0.30 cylindre + 0.16 demi-largeur robot)


# ---------------------------------------------------------------------
# Encoder dimensions
# ---------------------------------------------------------------------
encoders:
  lidar_cnn:
    in_channels: 1
    hidden_channels: [32, 64]
    kernel_size: 5
    padding: 2
    out_patches: 90
    feature_dim: 64
  pedestrian_mlp:
    hidden_dims: [64, 64]
    feature_dim: 64
  imu_mlp:                              # NEW in v0.2
    hidden_dims: [64, 64]
    feature_dim: 64                     # must match lidar/ped feature_dim
  goal_mlp:
    hidden_dims: [32]
    feature_dim: 32

# ---------------------------------------------------------------------
# Attention + gating
# ---------------------------------------------------------------------
attention:
  n_heads: 4
  feature_dim: 64
  dropout: 0.0
  use_imu_in_query: true                # NEW: ablation A1 toggle
  gate_type: "softmax_3way"             # NEW: "softmax_3way" | "softmax_2way"

# ---------------------------------------------------------------------
# Actor / critic head dimensions
# ---------------------------------------------------------------------
heads:
  actor_hidden: [256, 256]
  critic_hidden: [256, 256]
  log_std_min: -20.0
  log_std_max: 2.0

# ---------------------------------------------------------------------
# SAC core
# ---------------------------------------------------------------------
sac:
  gamma: 0.98
  tau: 0.005
  lr_actor: 3.0e-4
  lr_critic: 3.0e-4
  lr_alpha: 1.0e-4
  hidden_dim: 256
  batch_size: 256
  warmup_steps: 1000
  target_entropy: -1.0

# ---------------------------------------------------------------------
# Prioritized Experience Replay
# ---------------------------------------------------------------------
per:
  capacity: 1000000
  eta: 0.6
  beta_is_start: 0.4
  beta_is_end: 1.0
  beta_is_anneal_steps: 1000000
  epsilon: 1.0e-6
  use_attention_entropy: true
  nu: 0.5
  lam: 3.0

# ---------------------------------------------------------------------
# CBF safety shield
# ---------------------------------------------------------------------
cbf:
  enabled: true
  r_safe_static: 0.25            # déjà à 0.25, OK
  r_safe_ped: 0.40
  r_safe_deploy: 0.60
  gamma_cbf: 2.0                  # ← AUGMENTÉ : shield moins agressif quand actif
  active_radius: 0.7             # ← RÉDUIT : shield ne s'active qu'à 30cm (= r_safe_static + 5cm marge)
  qp_solver: "osqp"
  emergency_stop_on_infeasible: false
  v_min_shield: 0.0            # ←ne pas permettre le recule
  omega_gate_v: 0.15
  omega_min_floor: 0.2          # ← rotation autorisée même si shield actif (évite blocage)
  omega_decay_min: 0.3
  omega_decay_penalty: 2.0
  max_consecutive_infeasible: 10
# ---------------------------------------------------------------------
# Reward shaping (6 + 1 terms, additive decomposition)
# ---------------------------------------------------------------------
reward:
  r_goal: 25.0           # DenseCAvoid exactement
  r_collision: -25.0     # DenseCAvoid exactement, ratio -1.0
  c_progress: 3.5        # DenseCAvoid: "2.5(||p_prev - g|| - ||p - g||)"
  d_intimate: 1.2       # constante physique inchangée
  d_social: 2.5
  alpha_social: 0.5
  social_gate_blend: 1.0    # écrasé par train.py pendant le ramp
  collision_radius_ped: 0.46
  alpha_prox: 0.5        # rééchelonné (était 1.5% de r_goal)
  alpha_smooth: 0.6
  r_time: -0.01
  alpha_shield: 0.1      # rééchelonné (était 0.5% de r_goal)
  alpha_reverse: 0.05
  # NOUVEAU : pénalité approche obstacle statique
  alpha_static_prox: 0.5
  d_static_safe: 0.8
  collision_radius_static: 0.20
# ---------------------------------------------------------------------
# Gazebo / ROS 2 interface
# ---------------------------------------------------------------------
gazebo:
  world_name: "hospital"
  use_synchronous_stepping: false
  reset_service: "/world/{world}/control"
  set_pose_service: "/world/{world}/set_pose"
  spawn_service:    "/world/{world}/create"
  scan_topic:  "/model/limo/laser/scan"
  odom_topic:  "/model/limo/odometry"
  imu_topic:   "/model/limo/imu"                   # NEW in v0.2
  cmd_vel_topic: "/model/limo/cmd_vel"
  ped_tracks_topic: "/perception/pedestrian_tracks"
  use_ground_truth_pedestrians: true    # IMPORTANT: true for fast training
                                         # (~30 SAC steps/sec). Switch to false
                                         # only for ablation A5 or final eval
                                         # with full YOLO+DeepSORT pipeline.
  gt_pose_topic: "/world/{world}/dynamic_pose/info"
  use_reset_world: false
  use_set_pose: true
# ---------------------------------------------------------------------
# Training control
# ---------------------------------------------------------------------
training:
  seed: 42
  total_steps: 1500000
  eval_every: 25000
  save_every: 100000
  log_dir: "./runs/cm_gap_sac"
  device: "cuda"


reflex:
  enabled: true
  v_max: 0.5
  omega_max: 1.0
  k_omega: 1.0
  r_slowdown: 1.5
  n_front_beams: 30
  k_repulse: 1.5        # NEW: force de répulsion
  r_influence: 1.0
  beta_0: 0.5
  t_anneal: 200000        